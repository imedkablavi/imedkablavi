<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Animated cybersecurity terminal">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#0b1720"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#36bcf7" stroke-opacity=".055"/></pattern>
  </defs>
  <rect x="1" y="1" width="898" height="258" rx="18" fill="url(#bg)" stroke="#1f3b4d" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="256" rx="17" fill="url(#grid)"/>
  <g opacity=".55" fill="#36bcf7" font-family="monospace" font-size="13">
    <text x="32" y="54">01010110 01101001 01100111 01101001 01101100</text>
    <text x="535" y="232">0xC1B3X7 • SECURE CHANNEL</text>
  </g>
  <rect x="28" y="25" width="844" height="32" rx="8" fill="#111a21" stroke="#203643"/>
  <circle cx="48" cy="41" r="5" fill="#ff5f56"/><circle cx="66" cy="41" r="5" fill="#ffbd2e"/><circle cx="84" cy="41" r="5" fill="#27c93f"/>
  <text x="108" y="46" fill="#9ca3af" font-family="monospace" font-size="14">cybrex@security-lab:~</text>
  <g font-family="monospace" font-size="19">
    <text x="48" y="96" fill="#36bcf7">$</text><text x="68" y="96" fill="#e5e7eb">whoami</text>
    <text x="48" y="126" fill="#36bcf7">&gt;</text><text x="68" y="126" fill="#7dd3fc">IMED KABLAVI / CYBREXTECH</text>
    <text x="48" y="156" fill="#36bcf7">&gt;</text><text x="68" y="156" fill="#d1d5db">Cybersecurity • Digital Forensics • Software</text>
    <text x="48" y="186" fill="#36bcf7">$</text><text x="68" y="186" fill="#e5e7eb">sudo secure --everything</text>
    <text x="48" y="216" fill="#36bcf7">&gt;</text><text x="68" y="216" fill="#4ade80">ACCESS GRANTED</text>
    <rect x="236" y="201" width="11" height="20" fill="#36bcf7" filter="url(#glow)"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(760 92)" fill="none" stroke="#36bcf7" stroke-width="3" filter="url(#glow)">
    <rect x="0" y="30" width="58" height="50" rx="8"/><path d="M12 30V18a17 17 0 0 1 34 0v12"/>
    <circle cx="29" cy="54" r="5"/><path d="M29 59v10"/>
  </g>
  <rect x="0" y="0" width="900" height="3" fill="#36bcf7" opacity=".22">
    <animate attributeName="y" values="0;257;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
