name: One-time Markdown cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/.markdown-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Markdown only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          emoji = re.compile(
              '['
              '\U0001F1E6-\U0001F1FF'
              '\U0001F300-\U0001F5FF'
              '\U0001F600-\U0001F64F'
              '\U0001F680-\U0001F6FF'
              '\U0001F700-\U0001F77F'
              '\U0001F780-\U0001F7FF'
              '\U0001F800-\U0001F8FF'
              '\U0001F900-\U0001F9FF'
              '\U0001FA00-\U0001FAFF'
              '\u2600-\u26FF'
              '\u2700-\u27BF'
              ']+'
          )

          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              cleaned = text.replace('—', '-')
              cleaned = emoji.sub('', cleaned)
              cleaned = cleaned.replace('\ufe0f', '').replace('\u200d', '').replace('\u20e3', '')
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
          PY

      - name: Commit cleanup and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/markdown-cleanup-once.yml .github/.markdown-cleanup-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove emoji and em dash from Markdown'
          git push
